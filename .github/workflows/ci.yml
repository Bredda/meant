name: CI

# No path filter on the workflow on purpose: `main` requires the "checks" job,
# and a workflow skipped by a filter would leave documentation-only pull
# requests waiting forever. The job always runs and always reports; it only
# skips its heavy steps (system packages, Rust, builds) when nothing but
# documentation changed.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so commitlint can read the pull request's commits and
          # the diff below can find the merge base.
          fetch-depth: 0

      # Documentation-only: every changed file is Markdown or under reference/.
      # Anything unclear (no base commit, failed diff, empty diff) counts as code.
      - name: Detect documentation-only changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if files=$(git diff --name-only "$BASE...$HEAD") && [ -n "$files" ]; then
              if ! printf '%s\n' "$files" | grep -qvE '^(.*\.md|reference/.*|LICENSE.*)$'; then
                code=false
              fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changes: $code"

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Always checked, documentation included: release tooling reads them.
      - name: Commit messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Documentation only, code checks skipped
        if: steps.changes.outputs.code != 'true'
        run: |
          echo "Only documentation changed, so typecheck, Biome, tests, build and Rust checks were skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: pnpm typecheck
      - name: Lint and format (Biome)
        if: steps.changes.outputs.code == 'true'
        run: pnpm check
      - name: Frontend tests
        if: steps.changes.outputs.code == 'true'
        run: pnpm test
      # tauri::generate_context! expects the frontend build in ../dist.
      - name: Frontend build
        if: steps.changes.outputs.code == 'true'
        run: pnpm build

      - name: System dependencies (Tauri, keyring)
        if: steps.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev pkg-config build-essential

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.code == 'true'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.code == 'true'
        with:
          workspaces: src-tauri

      - name: Rust format
        if: steps.changes.outputs.code == 'true'
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        if: steps.changes.outputs.code == 'true'
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        if: steps.changes.outputs.code == 'true'
        working-directory: src-tauri
        run: cargo test
