name: CI

# Documentation-only changes cannot break the build: skip the run.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "reference/**"
      - "LICENSE"
      - "assets/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "reference/**"
      - "LICENSE"
      - "assets/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (Tauri, keyring)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev pkg-config build-essential

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Lint and format (Biome)
        run: pnpm check
      - name: Frontend tests
        run: pnpm test
      # tauri::generate_context! expects the frontend build in ../dist.
      - name: Frontend build
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
